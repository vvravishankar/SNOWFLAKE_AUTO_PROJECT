        description: Battery capacity including unit
        expr: AMP_HOURS
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: BATTERY_AGE
        description: Battery age derived from current year and battery manufacturing year
        expr: BATTERY_AGE
        data_type: "NUMBER(5,0)"
        access_modifier: public_access
      - name: BATTERY_AH
        description: Battery capacity in amp hours
        expr: BATTERY_AH
        data_type: "NUMBER(3,0)"
        access_modifier: public_access
      - name: BATTERY_SERIAL_NUMBER
        description: Battery serial number
        expr: BATTERY_SERIAL_NUMBER
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: BATTERY_TYPE
        description: Battery type
        expr: BATTERY_TYPE
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: CAR_ID
        description: Unique vehicle identifier
        expr: CAR_ID
        data_type: "NUMBER(5,0)"
        access_modifier: public_access
      - name: COUNTRY
        description: Vehicle country
        expr: COUNTRY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: CUT_OFF_VOLTAGE
        description: Battery cutoff voltage including unit
        expr: CUT_OFF_VOLTAGE
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: DISCHARGE_CURRENT
        description: Battery discharge current including unit
